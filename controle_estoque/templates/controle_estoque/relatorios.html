<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Relatórios - AMACE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="mb-4">Painel de Relatórios - AMACE</h2>

        <div class="row g-3">

            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>Beneficiários ativos</h6>
                        <h2>{{ total_beneficiarios }}</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>Produtos cadastrados</h6>
                        <h2>{{ total_produtos }}</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>Total de itens em estoque</h6>
                        <h2>{{ total_estoque }}</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-6">
                <div class="card shadow-sm border-success">
                    <div class="card-body">
                        <h6>Quantidade total de entradas</h6>
                        <h2 class="text-success">{{ total_entradas }}</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-6">
                <div class="card shadow-sm border-danger">
                    <div class="card-body">
                        <h6>Quantidade total de saídas</h6>
                        <h2 class="text-danger">{{ total_saidas }}</h2>
                    </div>
                </div>
            </div>

        </div>

        <a href="{% url 'listar_produtos' %}" class="btn btn-secondary mt-4">
            Voltar ao estoque
        </a>

    </div>

</body>

</html>
